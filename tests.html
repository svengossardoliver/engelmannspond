<script>
const results=[];
function check(name,ok,detail){ results.push({name,ok:!!ok,detail:detail==null?'':String(detail)}); }
const near=(a,b,tol)=>Math.abs(a-b)<=tol;
function b64urlDecode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function decodeLink(link){
  const h=link.split('#g=')[1]; const kind=h[0], body=h.slice(1);
  const bytes=b64urlDecode(body);
  if(kind==='z'){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(st).text()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function run(){
  const fr=document.getElementById('f'); const W=fr.contentWindow; const E=s=>W.eval(s);
  for(let i=0;i<100&&!W.EP_READY;i++) await new Promise(r=>setTimeout(r,50));
  check('app initialises',W.EP_READY===true);
  try{
    // ---------- the biology model ----------
    const G=(I,T,C)=>E(`Math.max(0,grossO2(${I},${T},${C})-respO2(${T})-BIO.th)`);
    check('rate rises with light',G(50,25,1)<G(100,25,1)&&G(100,25,1)<G(200,25,1));
    check('rate saturates at high light (1000 vs 500 within 10 %)',G(1000,25,1)/G(500,25,1)<1.10,(G(1000,25,1)/G(500,25,1)).toFixed(3));
    check('no light, no bubbles (below 28 °C)',E('bubbleRate({led:"blue",bright:0,dist:20,room:false,T:25,C:1},null)')===0);
    check('compensation point: very dim light gives no bubbles',G(4,25,1)===0);
    const lowT=G(25,27,1)/G(25,15,1), hiT=G(800,27,1)/G(800,15,1);
    check('Blackman: in dim light, warming 15 → 27 °C changes the rate by under 15 %',Math.abs(lowT-1)<0.15,lowT.toFixed(3));
    check('Blackman: in bright light, warming 15 → 27 °C raises the rate by over 50 %',hiT>1.5,hiT.toFixed(3));
    const lowC=G(25,25,1)/G(25,25,0.1), hiC=G(600,25,1)/G(600,25,0.1);
    check('Blackman: in dim light, NaHCO₃ 0.1 → 1 % changes the rate by under 15 %',Math.abs(lowC-1)<0.15,lowC.toFixed(3));
    check('Blackman: in bright light, NaHCO₃ 0.1 → 1 % raises the rate by over 40 %',hiC>1.4,hiC.toFixed(3));
    check('CO₂ response levels off: 2 % within 5 % of 1 %',Math.abs(G(600,25,2)/G(600,25,1)-1)<0.05);
    let best=0,Tb=0; for(let T=10;T<=45;T+=0.5){ const r=G(800,T,1); if(r>best){best=r;Tb=T;} }
    check('temperature optimum between 27 and 32 °C',Tb>=27&&Tb<=32,Tb);
    check('above 38 °C the rate is below 40 % of the optimum',G(800,38,1)<0.4*best,(G(800,38,1)/best).toFixed(2));
    check('warm water gives off gas even in the dark',E('bubbleRate({led:"blue",bright:0,dist:20,room:false,T:40,C:1},null)')>0);
    const at=id=>E(`bubbleRate({led:"${id}",bright:100,dist:Math.sqrt(LEDMAP["${id}"].ppfd*116/100-16),room:false,T:25,C:1},null)`);
    check('equal photon flux (100 µmol m⁻² s⁻¹) lands at 100',near(E('lampPPFD({led:"green",bright:100,dist:Math.sqrt(LEDMAP.green.ppfd*116/100-16)})'),100,1e-9));
    check('action spectrum: red (660) > blue (450) > green (530)',at('deepred')>at('blue')&&at('blue')>at('green'),[at('deepred'),at('blue'),at('green')].map(v=>v.toFixed(1)).join(' > '));
    check('green rate is under 60 % of deep red at equal photon flux',at('green')<0.6*at('deepred'));
    check('far red alone gives almost nothing',at('farred')<1);
    check('lux per µmol: green is over 10 × deep red (660) and blue (450)',E('luxPerUmol(LEDMAP.green)')>10*E('luxPerUmol(LEDMAP.deepred)')&&E('luxPerUmol(LEDMAP.green)')>10*E('luxPerUmol(LEDMAP.blue)'));
    check('lux per µmol for the white LED is 55–90 (typical 4000 K white LED)',E('luxPerUmol(LEDMAP.white)')>55&&E('luxPerUmol(LEDMAP.white)')<90,E('luxPerUmol(LEDMAP.white)').toFixed(1));
    // ---------- no LED is monochromatic ----------
    check('every LED spectrum sums to 1 (photon fractions)',E('LEDS.every(L=>Math.abs(L.spec.reduce((a,b)=>a+b,0)-1)<1e-9)'));
    check('the spectrometer reads each LED’s peak and FWHM within 1 nm',E('LEDS.filter(L=>L.nm).every(L=>Math.abs(L.meas.peak-L.nm)<=1&&Math.abs(L.meas.fwhm-L.fwhm)<=1)'),E('LEDS.filter(L=>L.nm).map(L=>L.nm+":"+L.meas.peak+"/"+L.meas.fwhm.toFixed(1)).join(" ")'));
    check('Δλ = half the FWHM: 530 nm → 18 nm, 590 nm → 8 nm',E('dLambda("green")')===18&&E('dLambda("amber")')===8,E('dLambda("green")')+', '+E('dLambda("amber")'));
    const gT=E('actionAt(530)/actionAt(660)'), gL=E('LEDMAP.green.eff/LEDMAP.deepred.eff');
    check('the broad green LED makes the green dip look shallower than the true action spectrum',gL>gT+0.05,`true ${gT.toFixed(2)}, LED ${gL.toFixed(2)}`);
    const fT=E('actionAt(730)'), fL=E('LEDMAP.farred.eff');
    check('the 730 nm LED’s effect is more than its peak wavelength alone would give (band reaches shorter λ)',fL>1.5*fT,`true ${fT.toFixed(3)}, LED ${fL.toFixed(3)}`);
    check('the PAR meter sees only the far-red LED’s tail (1–6 % of its photons)',E('LEDMAP.farred.par')>0.01&&E('LEDMAP.farred.par')<0.06,E('LEDMAP.farred.par').toFixed(3));
    check('the PAR meter counts 95 % or more of every LED from 450 to 660 nm, and 85–95 % of the 405 nm LED (its band reaches below 400 nm)',E('LEDS.filter(L=>L.nm&&L.nm<700&&L.nm>420).every(L=>L.par>0.95)')&&E('LEDMAP.violet.par')>0.85&&E('LEDMAP.violet.par')<0.95,E('LEDS.filter(L=>L.nm).map(L=>L.par.toFixed(2)).join(" ")'));
    check('white LED: blue chip and phosphor give two peaks',(()=>{ const sp=E('Array.from(LEDMAP.white.spec)'); const at=l=>sp[l-350]; return at(452)>at(500)&&at(595)>at(500); })());
    check('PAR meter sees under 10 % of far-red photons',E('parTrue({led:"farred",bright:100,dist:10,room:false})/lampPPFD({led:"farred",bright:100,dist:10})')<0.1);
    const ratio=E('geom(10)/geom(20)');
    check('lamp is not a point source: I(10 cm)/I(20 cm) between 3 and 3.9',ratio>3&&ratio<3.9,ratio.toFixed(2));
    const off15=E('geom(15,2.5)/geom(15,0)'), off5=E('geom(5,2.5)/geom(5,0)');
    check('a tube 2.5 cm off the axis gets less light: 2–7 % less at 15 cm',off15>0.93&&off15<0.98,off15.toFixed(3));
    check('…and over 15 % less with the lamp at 5 cm',off5<0.85,off5.toFixed(3));
    // ---------- counting statistics ----------
    const st=E(`(()=>{ const r=mulberry32(5); const a=[]; for(let i=0;i<300;i++) a.push(simCount(30,60,r)); return a; })()`);
    const tn=st.map(x=>x.trueN), m=tn.reduce((a,b)=>a+b,0)/tn.length, v=tn.reduce((a,b)=>a+(b-m)**2,0)/(tn.length-1);
    check('60 s counts at 30 bubbles min⁻¹ average 30 (± 5 %)',near(m,30,1.5),m.toFixed(2));
    check('counts scatter (SD over 1), but bubbles are more regular than random (variance below the mean)',Math.sqrt(v)>1&&v<m,`SD ${Math.sqrt(v).toFixed(2)}, var ${v.toFixed(1)}`);
    const fast=E(`(()=>{ const r=mulberry32(6); let N=0,T=0; for(let i=0;i<60;i++){ const c=simCount(150,60,r); N+=c.N; T+=c.trueN; } return N/T; })()`);
    const slow=E(`(()=>{ const r=mulberry32(7); let N=0,T=0; for(let i=0;i<60;i++){ const c=simCount(20,60,r); N+=c.N; T+=c.trueN; } return N/T; })()`);
    check('optical counter undercounts fast streams (150 min⁻¹ → 75–97 %)',fast<0.97&&fast>0.75,fast.toFixed(3));
    check('optical counter is accurate for slow streams (20 min⁻¹ → over 99 %)',slow>0.99,slow.toFixed(3));
    // ---------- statistics against SciPy ----------
    const A=E('anova([[1,2,3],[2,3,4],[5,6,7]])');
    check('one-way ANOVA: F = 13.0, p = 0.00659 (SciPy)',near(A.F,13,1e-9)&&near(A.p,0.006591796875,1e-6),`F ${A.F} p ${A.p}`);
    const T2=E('welch([1,2,3,4,5],[2,4,6,8,10])');
    check('Welch t-test: t = −1.897, df = 5.882, p = 0.1075 (SciPy)',near(T2.t,-1.8973665961,1e-6)&&near(T2.df,5.882352941,1e-6)&&near(T2.p,0.1075311949,1e-5),`t ${T2.t} df ${T2.df} p ${T2.p}`);
    // ---------- the bench ----------
    E('S.runs=[];S.nextId=1;S.led="blue";S.bright=60;S.dist=15;S.room=false;S.bathOn=true;S.setT=25;S.nah=4;S.tube.forEach(t=>t.C=1);S.tube[0].sprig=0;');
    E('fastForward(900)');
    check('water bath reaches 25.0 °C within 15 min',near(E('S.T'),25,0.3),E('S.T').toFixed(2));
    E('setSprigIdx(1)'); E('fastForward(10)');
    check('a new sprig starts slowly (rate after 10 s under 40 % of target)',E('S.tube[0].rt.r')<0.4*E('targetRate()'),`${E('S.tube[0].rt.r').toFixed(1)} vs ${E('targetRate()').toFixed(1)}`);
    E('fastForward(900)');
    check('…and has settled after 15 min (within 5 %)',near(E('S.tube[0].rt.r'),E('targetRate()'),0.05*E('targetRate()')));
    E('setBright(80)'); check('a change resets the settling clock',near(E('S.clock-S.tube[0].lastChange'),0,1e-9));
    E('fastForward(240)'); E('startAuto()');
    E('setBright(30)'); check('the lamp is locked while the automatic counter runs',E('S.bright')===80);
    E('fastForward(61)');
    const r1=E('S.runs[S.runs.length-1]');
    check('an automatic count is logged with its conditions',!!r1&&r1.kind==='auto'&&r1.bright===80&&r1.led==='blue'&&r1.t===60&&r1.settle>=239,JSON.stringify(r1));
    check('the logged count is plausible for the settled rate',r1&&Math.abs(r1.N-E('targetRate()'))<0.35*E('targetRate()')+3,`${r1&&r1.N} vs ${E('targetRate()').toFixed(1)}`);
    E('S.tube[0].C=1;'); E('fastForward(1800)');
    check('the sprig uses up the NaHCO₃',E('S.tube[0].C')<1);
    E('freshSolution()'); check('FRESH SOLUTION refills it',E('S.tube[0].C')===1);
    E('setBath(false)'); E('setDist(5)'); E('setBright(100)'); E('S.T=21'); E('fastForward(1800)');
    check('without the bath, a close bright lamp warms the water by over 2 °C',E('S.T')>23,E('S.T').toFixed(2));
    E('setBath(true)'); E('setSetT(42)'); E('fastForward(1200)');
    const dmg=E('curSprig().dmg'); E('setSetT(25)'); E('fastForward(1200)');
    check('heat above 38 °C damages the sprig, and the damage stays',dmg>0.2&&E('curSprig().dmg')===dmg,dmg.toFixed(2));
    // ---------- the optical gate counts when a bubble crosses the beam ----------
    E('setTubes(1); S.tube[0].rt.q=[]; S.tube[0].rt.lastG=-1e9; setBright(0); S.T=25; setBath(true); setSetT(25); S.tube[0].rt.r=0; S.tube[0].rt.gas=0; startAuto();');
    E('onBubble(0,S.clock)');
    const g0=E('S.auto.counts[0]'); E('fastForward(GATE_DELAY*0.6)'); const g1=E('S.auto.counts[0]'); E('fastForward(GATE_DELAY*0.6)'); const g2=E('S.auto.counts[0]');
    check('the gate counts a bubble when it reaches the beam, not when it leaves the stem',g0===0&&g1===0&&g2===1,`${g0} → ${g1} → ${g2}`);
    E('fastForward(S.auto.t0+S.auto.win-S.clock-0.1); onBubble(0,S.clock);'); E('fastForward(1);');
    check('a bubble released just before the window ends, crossing after it, is not counted',E('S.runs[S.runs.length-1].N')===1,E('S.runs[S.runs.length-1].N'));
    check('the gate light flashes at the crossing',E('S.tube[0].rt.lastG')>E('S.tube[0].rt.lastB'));
    E('setBright(60)');
    // ---------- three tubes ----------
    E('S.runs=[];S.nextId=1;setBath(true);setSetT(25);S.T=25;setDist(12);setBright(70);setTubes(3);');
    check('3 TUBES: three tubes with three different sprigs',E('S.tubes')===3&&new Set(E('activeTubes().map(t=>t.sprig)')).size===3);
    check('the middle position gets the most light',E('parTrue(condT(S.tube.findIndex(t=>t.pos===1)))')>E('parTrue(condT(S.tube.findIndex(t=>t.pos===0)))'));
    E('fastForward(400); startAuto(); fastForward(61);');
    const r3=E('S.runs');
    check('one automatic count logs all three tubes, with their own sprig and position',r3.length===3&&r3.map(r=>r.tube).join()==='A,B,C'&&r3.map(r=>r.pos).join()==='1,2,3'&&new Set(r3.map(r=>r.sprig)).size===3&&r3.every(r=>r.tubes===3&&r.t===60),JSON.stringify(r3.map(r=>[r.tube,r.pos,r.sprig,r.N,r.par])));
    check('each tube is counted by its own gate (counts differ)',new Set(r3.map(r=>r.N)).size>1,r3.map(r=>r.N).join());
    E('selectTube(2); setSprigStep(1);');
    check('the sprig controls skip sprigs already in another tube',new Set(E('activeTubes().map(t=>t.sprig)')).size===3);
    const p0=E('S.tube.map(t=>t.pos)'); E('rotateTubes()');
    check('ROTATE moves every tube one place and restarts settling',E('S.tube.map(t=>t.pos)').join()===p0.map(p=>(p+1)%3).join()&&E('S.tube.every(t=>t.lastChange===S.clock)'));
    E('selectTube(1); fastForward(300); manStartStop(); for(let i=0;i<12;i++) tapBubble(); fastForward(60); manStartStop();');
    const rm=E('S.runs[S.runs.length-1]');
    check('a manual count is logged for the selected tube only',rm.kind==='manual'&&rm.tube==='B'&&rm.N===12&&near(rm.t,60,0.06)&&E('S.runs.length')===4,JSON.stringify(rm));
    check('the tube switch is locked while a count runs',(()=>{ E('startAuto(); setTubes(1);'); const t=E('S.tubes'); E('stopAuto(false)'); return t===3; })());
    check('with three tubes, each sprig’s mean is a trial by default',E('aggMode()')==='sprig');
    E(`S.runs=[]; S.nextId=1;
      for(const [sp,led,N] of [[0,'blue',30],[0,'blue',32],[1,'blue',24],[1,'blue',26],[2,'blue',36],[0,'green',14],[1,'green',12],[2,'green',16],[2,'green',18]]) addRun({kind:'auto',clock:0,led,bright:50,dist:15,room:false,bathOn:true,setT:25,tubes:3,tube:'A',pos:1,sprig:sp,cuts:1,nah:1,par:100,lux:1,T:25.0,settle:300,t:60,N});`);
    const gs=E('groupRuns("nm").groups.map(g=>g.trials.map(t=>t.v))');
    check('per-sprig trials: blue = 31, 25, 36 and green = 14, 12, 17',gs[0].join()==='31,25,36'&&gs[1].join()==='14,12,17',JSON.stringify(gs));
    const sg3=await decodeLink(await E('sglURL("nm")'));
    check('SGL gets one trial per sprig, labelled as sprig means',sg3.trials===3&&sg3.rows[0].y.join()==='31.0,25.0,36.0'&&/per sprig/.test(sg3.y.name),JSON.stringify(sg3.rows));
    E('S.agg="count"; renderTable();');
    check('switching to every count gives 4 trials for green',E('groupRuns("nm").groups[1].trials.length')===4);
    E('S.agg=null; setTubes(1);');
    check('back to 1 TUBE: one tube, every count a trial',E('S.tubes')===1&&E('aggMode()')==='count'&&E('S.sel')===0);
    // ---------- teacher link ----------
    const L=document.getElementById('L').contentWindow, EL=s=>L.eval(s);
    for(let i=0;i<100&&!L.EP_READY;i++) await new Promise(r=>setTimeout(r,50));
    EL('setTubes(1); startAuto();');
    check('teacher link: tubes=3 cannot be switched off',EL('S.tubes')===3&&EL('document.querySelector("[data-tubes=\'1\']").disabled')===true);
    check('teacher link: counter=manual stops the automatic counter',EL('S.auto.running')===false&&EL('HITS.some(h=>h.id==="autoGo")')===false);
    check('teacher link: trials=sprig fixes the results table',(()=>{ EL('S.agg="count"'); return EL('aggMode()')==='sprig'; })());
    check('teacher link: the header says what the teacher set',/3 tubes · manual counting · sprig means/.test(EL('document.getElementById("tlock").textContent')));
    EL('document.getElementById("tlTubes").value="1"; document.getElementById("tlCounter").value="manual"; document.getElementById("tlTrials").value=""; syncTeacherLink();');
    check('the help sheet builds a set-up link',/\?tubes=1&counter=manual$/.test(EL('document.getElementById("tlUrl").value')),EL('document.getElementById("tlUrl").value'));
    check('no script errors with a teacher link',(L.__errors||[]).length===0,(L.__errors||[]).join(' | '));
    // ---------- results table and SGL ----------
    E(`S.runs=[];S.nextId=1;
      for(const [led,N] of [['blue',30],['blue',32],['blue',29],['green',14],['green',15],['green',13],['white',25]]) addRun({kind:'auto',clock:0,led,bright:50,dist:15,room:false,bathOn:true,setT:25,sprig:0,cuts:1,nah:1,par:led==='green'?100:101,lux:1,T:25.0,settle:300,t:60,N});
      S.iv='nm'; renderTable();`);
    const gr=E('groupRuns("nm")');
    check('results table groups by wavelength and leaves out white',gr.groups.length===2&&gr.groups[0].x===450&&gr.groups[1].x===530&&gr.skipped.length===1);
    const link=await E('sglURL("nm")'); const sg=await decodeLink(link);
    check('Open in SGL: wavelength on x, three trials, ± 1 SD',sg.x.unit==='nm'&&sg.trials===3&&sg.spread==='sd'&&sg.rows.length===2&&sg.rows[0].y.join()==='30.0,32.0,29.0'&&sg.fit==='none'&&sg.origin===false,JSON.stringify(sg.rows));
    check('Open in SGL: each LED’s Δλ goes as its own x uncertainty (450 → ±10, 530 → ±18)',sg.perPoint===true&&sg.rows[0].dx==='10'&&sg.rows[1].dx==='18',JSON.stringify(sg.rows.map(r=>r.dx)));
    check('Open in SGL points at sisgraphicallaboratory.netlify.app',link.startsWith('https://sisgraphicallaboratory.netlify.app/#g='));
    check('controlled variables look constant for these counts',E('controlWarnings("nm",groupRuns("nm").rs).length')===0,E('controlWarnings("nm",groupRuns("nm").rs).join(" | ")'));
    E(`S.runs[0].par=140; S.runs[1].T=27.3;`);
    const wn=E('controlWarnings("nm",groupRuns("nm").rs)');
    check('…and are flagged when PAR and temperature were not held constant',wn.some(w=>/PAR/.test(w))&&wn.some(w=>/Temperature/.test(w)),wn.join(' | '));
    // ---------- guide ----------
    E('S.runs=[];S.nextId=1;S.guides={};setGuide("action");');
    E('S.sprigs.forEach(sp=>sp.dmg=0);S.bathOn=true;S.setT=25;S.nah=4;S.tube.forEach(t=>t.C=1);S.room=false;S.T=25;S.led="blue";S.dist=15;');
    E(`(()=>{ for(let b=0;b<=100;b++){ S.bright=b; if(Math.abs(readMeters(true).par-100)<=1) break; } })()`);
    E('gstore().items={a1:{attempted:true},a2:{attempted:true},a3:{attempted:true}}; refreshGuide(true);');
    check('guide: set-up task ticks itself when the bench is ready',E('itemDone(findItem("t1"))')===true);
    check('guide: PAR task ticks at 100 ± 5',E('itemDone(findItem("t2"))')===true,E('readMeters(true).par'));
    E('gstore().items.a4={attempted:true}; gstore().items.a18={attempted:true}; gstore().items.a19={attempted:true}; gstore().items.a5={attempted:true}; changed(); fastForward(200); startAuto(); fastForward(61); refreshGuide(true);');
    check('guide: a settled 60 s count ticks the one-count task',E('itemDone(findItem("t3"))')===true);

    check('guide: worked rate check accepts 60N/t',E(`findItem("a6").check(${R}).ok`)===true&&E(`findItem("a6").check(${R*1.2}).ok`)===false);
    E('gstore().items.a6={attempted:true}; for(let i=0;i<4;i++){ startAuto(); fastForward(61); } refreshGuide(true);');

    check('Predict: a challenge is set with a clear answer',!!c&&[0,1,2].includes(c.ans));

    check('tour: placing a module builds it',E('isBuilt("lamp")')===true);
    E('setLed("red"); tourTick();');
    check('tour: the Try it ticks when done',/tc-try ok/.test(E('document.getElementById("tourCard").innerHTML')));
    E('endTour()');
    check('tour: Skip or Finish builds the whole bench',E('["clock","spec","lamp","sol","tubes","bath","meters","counter"].every(isBuilt)'));
    E('setTubes(3); startTour();');
    check('tour: with three tubes it includes the Three tubes step',E('TOUR.list.some(s=>s.key==="tubes")')===true);
    E('endTour(); setTubes(1);');
    // ---------- help sheet ----------
    check('test mode: the help sheet does not open by itself',E('document.getElementById("helpDlg").open')===false);
    E('openHelp()');
    check('openHelp() opens the help sheet with 13 sections',E('document.getElementById("helpDlg").open')===true&&E('document.querySelectorAll("#helpDlg .help-body section").length')===13);
    E('closeHelp()');
    check('closeHelp() closes it',E('document.getElementById("helpDlg").open')===false);
    E('draw()');
  }catch(e){ check('test run completed',false,e.stack||e.message); }
  check('no script errors',(W.__errors||[]).length===0,(W.__errors||[]).join(' | '));
  const out=document.getElementById('out'); const failed=results.filter(r=>!r.ok).length;
  out.innerHTML=results.map(r=>`<span class="${r.ok?'p':'f'}">${r.ok?'PASS':'FAIL'}</span>  ${r.name}${r.detail?'  · '+r.detail:''}`).join('\n');
  document.getElementById('sum').textContent=`${results.length-failed}/${results.length} passed`;
  window.TEST_RESULTS=results; window.TEST_DONE=true;
}
window.addEventListener('load',()=>run());
</script>
</body>
